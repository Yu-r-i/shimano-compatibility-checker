<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- ========== 基本SEO ========== -->
    <title>Shimano Compatibility Checker / コンポーネント 互換性チェッカー</title>
    <meta
      name="description"
      content="[Shimano Compatibility Checkerは、シマノ製コンポーネントやパーツの互換性を簡単に確認できるWebアプリです。型番や仕様から素早く検索・比較できます。]"
    />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- ========== OGP / SNS ========== -->
    <meta property="og:site_name" content="Shimano Compatibility Checker" />
    <meta property="og:title" content="Shimano Compatibility Checker / コンポーネント 互換性チェッカー" />
    <meta
      property="og:description"
      content="[Shimano Compatibility Checkerは、シマノ製コンポーネントやパーツの互換性を簡単に確認できるWebアプリです。型番や仕様から素早く検索・比較できます。]"
    />
    <!-- 絶対URLを推奨（403や相対解釈ミスを避けるため） -->
    <meta property="og:image" content="%VITE_OGP_IMAGE_URL%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitterカード（X） -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shimano Compatibility Checker / コンポーネント 互換性チェッカー" />
    <meta
      name="twitter:description"
      content="[Shimano Compatibility Checkerは、シマノ製コンポーネントやパーツの互換性を簡単に確認できるWebアプリです。型番や仕様から素早く検索・比較できます。]"
    />
    <meta name="twitter:image" content="%VITE_OGP_IMAGE_URL%" />

    <!-- ========== アイコン類 ========== -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 任意: PWA/manifest を使う場合 -->
    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->

    <!-- ========== パフォーマンス微調整（任意） ========== -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 例: Google Fonts を使うなら preload で先読み（実際のURLに置換） -->
    <!-- <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?..." /> -->
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?..." media="print" onload="this.media='all'" /> -->

    <!-- ========== 構造化データ（JSON-LD） ========== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Shimano Compatibility Checker",
      "url": "%VITE_SITE_URL%",
      "inLanguage": "ja",
      "description": "[Shimano Compatibility Checkerは、シマノ製コンポーネントやパーツの互換性を簡単に確認できるWebアプリです。型番や仕様から素早く検索・比較できます。]",
      "publisher": {
        "@type": "Organization",
        "name": "yu-r-i",
        "url": "%VITE_SITE_URL%",
        "logo": {
          "@type": "ImageObject",
          "url": "%VITE_OGP_IMAGE_URL%"
        }
      }
    }
    </script>

    <!-- 検索コンソール等の検証トークンはドメインごとに異なるため env で管理。未設定時は出力されない -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
  </head>
  <body>
    <noscript>本サイトを利用するにはJavaScriptを有効にする必要がある。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
